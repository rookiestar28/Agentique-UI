[package]
name = "agentique-ui"
version = "0.1.0"
description = "Local-first workspace for Agentique resources."
authors = ["Agentique"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "agentique_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "prefer-btree-collections", "extra-checks"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
